name: kafka
title: Apache Kafka
icon: kafka
type: datastore
scalable: false

labels:
- kafka
- messaging
- streaming

options:
- version: '4.3'
  tag: '4.3.1'
  default: true

endpoints:
- name: kafka
  ports:
  - name: broker
    number: 9092
    protocol: tcp
    main: true
    private: true

tokens:
- name: cluster_id
  generate:
    regex: '[A-Za-z0-9_-]{22}'

env:
- name: CLUSTER_ID
  value: '{{cluster_id}}'
  secret: true
- name: KAFKA_NODE_ID
  value: '1'
- name: KAFKA_PROCESS_ROLES
  value: broker,controller
- name: KAFKA_LISTENERS
  value: PLAINTEXT://:9092,CONTROLLER://:9093
- name: KAFKA_ADVERTISED_LISTENERS
  value: PLAINTEXT://{{service.host}}:9092
- name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
  value: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
- name: KAFKA_CONTROLLER_LISTENER_NAMES
  value: CONTROLLER
- name: KAFKA_INTER_BROKER_LISTENER_NAME
  value: PLAINTEXT
- name: KAFKA_CONTROLLER_QUORUM_VOTERS
  value: 1@127.0.0.1:9093
- name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
  value: '1'
- name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
  value: '1'
- name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
  value: '1'
- name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
  value: '0'
- name: KAFKA_LOG_DIRS
  value: /var/lib/kafka/data

volumes:
- name: data
  title: Kafka data
  size: 20
  helm:
    labels: persistence.labels
    values:
    - name: persistence.enabled
      value: true
    - name: persistence.existingClaim
      value: '{{volumes.data.claim}}'
    - name: persistence.size
      value: '{{volumes.data.size}}Gi'

helm:
  name: wodby
  source: oci://registry-1.docker.io/wodby/stateful
  chart: oci://registry-1.docker.io/wodby/stateful
  version: 0.2.0
  valueMappings:
    replicas: replicaCount
    nameOverride: nameOverride
    fullnameOverride: fullnameOverride
    serviceAccountName: serviceAccount.name
    serviceAccountCreate: serviceAccount.create
    strategy: updateStrategy.type
    minReady: minReadySeconds
    shutdownGracePeriod: terminationGracePeriodSeconds
  values:
  - name: containerName
    value: kafka
  - name: containerPorts
    value:
    - name: broker
      containerPort: 9092
      protocol: TCP
    - name: controller
      containerPort: 9093
      protocol: TCP
  - name: service.ports
    value:
    - name: broker
      port: 9092
      targetPort: broker
      protocol: TCP
  - name: headlessService.enabled
    value: false
  - name: persistence.mountPath
    value: /var/lib/kafka/data
  - name: podSecurityContext
    value:
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
  - name: startupProbe
    value:
      tcpSocket:
        port: broker
      failureThreshold: 30
      periodSeconds: 5
  - name: readinessProbe
    value:
      tcpSocket:
        port: broker
      periodSeconds: 10
  - name: livenessProbe
    value:
      tcpSocket:
        port: broker
      initialDelaySeconds: 30
      periodSeconds: 20

workloads:
- name: main
  selector:
    matchLabels:
      app.kubernetes.io/instance: '{{helm.release}}'
  kind: statefulset
  primary: true
  helm:
    labels: podLabels
    annotations: podAnnotations
    volumes: extraVolumes
  containers:
  - name: kafka
    image: apache/kafka
    helm:
      resources: resources
      env: envVars
      mounts: extraVolumeMounts
